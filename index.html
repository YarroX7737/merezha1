<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мапа магістралей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  color-scheme: light dark;
  --bg: #eef2f2; --panel: #ffffff; --ink: #14212b; --muted: #5b6b76; --line: #d3dcdf;
  --accent: #0a7b76; --accent-ink: #ffffff; --bad: #c43a31;
  --plan: #7048e8; --built: #1c7ed6; --fault: #e03131;
  --shadow: 0 1px 2px rgba(20,33,43,.14), 0 8px 24px rgba(20,33,43,.14);
  --font: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --panel-w: 360px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1a20; --panel: #16252d; --ink: #e5eef1; --muted: #90a4ae; --line: #29404b; --accent: #3cc3ba; --accent-ink: #06201e; --bad: #f2706a; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.5); }
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px var(--gr) 10px var(--gl); background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 1300; }
.brand { min-width: 0; flex: 1 1 auto; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.brand p { margin: 0; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; order: 3; flex: 1 1 100%; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
#results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; max-height: 50vh; overflow-y: auto; }
#results button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 12px; font-size: 13px; }
#results button:first-child { border-top: 0; }
#results button:hover { background: var(--bg); }
#results p { margin: 0; padding: 10px 12px; color: var(--muted); font-size: 13px; }
@media (min-width: 760px) { .search { order: 0; flex: 0 1 420px; } .brand { flex: 0 0 auto; margin-right: 8px; } .bar { flex-wrap: nowrap; } .spacer { flex: 1; } }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; font-weight: 500; text-decoration: none; display: inline-block; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.block { display: block; width: 100%; }

#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; background: #e8ecec; }
#map.draw { cursor: crosshair; }
.leaflet-container { font-family: var(--font); }
.leaflet-top.leaflet-left { top: 8px; }
.leaflet-control-scale-line { background: rgba(255,255,255,.85); }
.bx { width: 28px; height: 28px; position: relative; }
.bx svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.bx.sel::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px dashed #111; background: rgba(255,255,255,.35); }
.sym { fill: var(--c); stroke: #fff; stroke-width: 2; }
.st-plan { --c: var(--plan); } .st-built { --c: var(--built); } .st-fault { --c: var(--fault); }
.vt { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #111; }
.vt.on { background: #ffd43b; }
.md { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; opacity: .9; }
.lbl.leaflet-tooltip { background: transparent; border: 0; box-shadow: none; color: #111; font: 500 11.5px var(--font); text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff; padding: 0; white-space: nowrap; }
.lbl.leaflet-tooltip::before { display: none; }
.z-low .lbl { display: none; }
.obl-label { font: 700 12px var(--font); letter-spacing: .12em; color: #0a5f5b; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff; white-space: nowrap; text-align: center; }
.z-hi .obl-label { display: none; }
.found { width: 22px; height: 22px; border-radius: 50%; background: rgba(224,49,49,.25); border: 3px solid #e03131; }

.legend { position: absolute; left: var(--gl); top: 52px; z-index: 1000; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; box-shadow: var(--shadow); display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { width: 20px; height: 8px; }
.zoom { position: absolute; right: var(--gr); top: 12px; z-index: 1000; display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); background: var(--panel); }
.zoom button { width: 40px; height: 40px; border: 0; background: transparent; font-size: 20px; line-height: 1; }
.zoom button + button { border-top: 1px solid var(--line); }

#dock { position: absolute; left: 0; right: 0; bottom: 18px; padding: 0 var(--gr) 12px var(--gl); display: grid; gap: 8px; justify-items: center; pointer-events: none; z-index: 1000; }
#dock > * { pointer-events: auto; }
.hint { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); max-width: 520px; text-align: center; box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; font-size: 12.5px; box-shadow: var(--shadow); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.chip .ico { width: 18px; height: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
.seg button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 11px 16px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#draftbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow); font-size: 13px; white-space: nowrap; }
#draftbar span { font-family: var(--mono); font-size: 12px; }

#panel { position: absolute; top: 0; right: 0; bottom: 0; width: var(--panel-w); z-index: 1200; background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; }
#panelBody { overflow-y: auto; padding: 14px var(--gr) 24px 16px; display: grid; gap: 14px; align-content: start; flex: 1; }
.ph-head { display: flex; align-items: center; gap: 10px; }
.ph-head .ico { width: 34px; height: 34px; flex: none; background: var(--bg); border-radius: 10px; padding: 5px; }
.ph-title { min-width: 0; flex: 1; display: grid; }
.ph-title strong { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; }
.x:hover { background: var(--bg); }
.x svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
.f { display: grid; gap: 5px; min-width: 0; }
.f > label, .f > .lab { font-size: 12px; font-weight: 600; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f input, .f select, .f textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; }
.f textarea { min-height: 84px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.status { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.status button { border: 0; background: transparent; padding: 8px 4px; font-size: 12.5px; font-weight: 500; }
.status button + button { border-left: 1px solid var(--line); }
.status button[aria-pressed="true"] { background: var(--c); color: #fff; }
.addsub { width: 26px; height: 26px; border-radius: 50%; background: #0ca678; color: #fff; font: 700 18px/22px var(--font); text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); cursor: grab; touch-action: none; }
.sp svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.subst .st-built { --c: #0ca678; }
.sublist { text-align: left; }
.sublist span { color: var(--muted); font-weight: 400; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw.custom { position: relative; overflow: hidden; background: conic-gradient(#e03131, #f08c00, #2f9e44, #1c7ed6, #7048e8, #e03131); display: block; }
.sw.custom input { position: absolute; inset: -6px; width: 44px; height: 44px; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.coord { display: flex; gap: 8px; align-items: center; }
.coord code { flex: 1; font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; }
.coord input { flex: 1; }
.len { display: flex; align-items: baseline; justify-content: space-between; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.len b { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.thumb { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; padding: 0; background: var(--bg); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.add { border-style: dashed; font-weight: 600; color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

#menu { position: absolute; top: 8px; right: var(--gr); width: min(320px, calc(100% - var(--gl) - var(--gr))); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: grid; gap: 8px; z-index: 1250; }
#menu .btn { text-align: left; }
#menu .goto { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
#menu input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0; font-family: var(--mono); font-size: 12.5px; }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

#lightbox { position: fixed; inset: 0; background: rgba(5,10,14,.92); z-index: 5000; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#lightbox .lb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px var(--gr) 10px var(--gl); color: #fff; }
#lightbox .lb-top .btn { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.25); }
#lightbox .lb-img { display: grid; place-items: center; min-height: 0; padding: 0 var(--gr) 16px var(--gl); }
#lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
#login { position: fixed; inset: 0; z-index: 7000; background: rgba(5,10,14,.72); display: grid; place-items: center; padding: 16px; }
#login .card { width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 8px; box-shadow: var(--shadow); }
#login h2 { margin: 0; font-size: 17px; }
#login label { font-size: 12px; font-weight: 600; color: var(--muted); }
#login input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px; }
#login input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
#toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: 13px; box-shadow: var(--shadow); z-index: 6000; max-width: calc(100% - 32px); text-align: center; }
#banner { background: var(--bad); color: #fff; padding: 6px var(--gr) 6px var(--gl); font-size: 12.5px; }

#app.panel-open .zoom { right: calc(var(--panel-w) + 12px); }
#app.panel-open #dock { right: var(--panel-w); }
#app.panel-open #menu { right: calc(var(--panel-w) + 12px); }
@media (max-width: 720px) {
  #panel { top: auto; left: 0; width: 100%; max-height: 62%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #panelBody { padding: 12px var(--gr) 20px var(--gl); }
  #app.panel-open #dock, #app.panel-open .zoom { display: none; }
  #app.panel-open #menu { right: var(--gr); }
  .zoom { top: auto; bottom: 170px; }
  .legend { display: none; }
}

/* ===== v2: оновлений вигляд і зручність на телефоні ===== */
:root { --r: 14px; --accent2: #0a9a93; --glass: color-mix(in srgb, var(--panel) 88%, transparent); }
body { font-size: 15px; }
.bar { gap: 8px 10px; padding: 8px var(--gr) 8px var(--gl); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.brand h1 { font-size: 17px; }
.brand p { font-size: 11px; }
.search input { font-size: 16px; padding: 11px 14px; border-radius: 12px; }
#btnMenu, #btnSave { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 9px 12px; }
.btn { border-radius: 12px; min-height: 40px; }
.btn.primary { background: linear-gradient(180deg, var(--accent2), var(--accent)); }
.fab { position: absolute; right: var(--gr); top: 12px; z-index: 1000; display: grid; gap: 8px; justify-items: end; }
.fab .btn { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); font-size: 13px; padding: 8px 14px; border-radius: 999px; min-height: 38px; }
.zoom { top: 108px; border-radius: 14px; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.zoom button { width: 44px; height: 44px; font-size: 22px; }
#app.panel-open .fab { right: calc(var(--panel-w) + 12px); }
#dock { bottom: 0; padding: 0 var(--gr) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gl); }
.hint { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; font-size: 12.5px; padding: 7px 12px; }
.seg { width: min(100%, 440px); display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 18px; padding: 5px; gap: 4px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow); }
.seg button { flex-direction: column; justify-content: center; gap: 3px; padding: 9px 6px; border-radius: 14px; font-size: 12.5px; min-height: 56px; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg svg { width: 22px; height: 22px; }
.chip { padding: 8px 12px; font-size: 13px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#draftbar { top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); border-radius: 16px; padding: 8px 8px 8px 14px; }
#draftbar .btn { min-height: 44px; padding: 8px 12px; }
#draftbar { flex-wrap: wrap; justify-content: center; width: calc(100% - 24px); max-width: 420px; white-space: normal; }
#draftbar .btn { flex: 1 1 0; padding: 8px 6px; }
#draftbar span { flex: 1 1 100%; text-align: center; }
#panel { border-radius: 20px 0 0 20px; }
.grab { display: none; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; flex: none; }
.f input, .f select, .f textarea { font-size: 16px; padding: 11px 12px; border-radius: 10px; }
.f textarea { min-height: 96px; }
.status button { padding: 11px 4px; font-size: 13px; }
.x { width: 44px; height: 44px; }
.sw { width: 38px; height: 38px; }
.thumb { border-radius: 12px; }
#menu { border-radius: 16px; padding: 12px; }
#menu .btn { padding: 12px 14px; }
#menu input { font-size: 16px; padding: 10px 12px; }
#toast { bottom: calc(110px + env(safe-area-inset-bottom, 0px)); border-radius: 12px; }
#login .card { border-radius: 18px; padding: 22px; }
#login input { font-size: 16px; padding: 12px; }
#login .btn { min-height: 46px; }
@media (max-width: 720px) {
  #btnMenu span, #btnSave span { display: none; }
  #btnMenu, #btnSave { padding: 9px 11px; }
  .bar { flex-wrap: wrap; }
  .brand { flex: 1 1 0; }
  .search { order: 3; }
  #panel { top: auto; max-height: 72%; border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); background: var(--panel); }
  .grab { display: block; }
  #panelBody { padding: 8px var(--gr) 24px var(--gl); gap: 16px; }
  #app.panel-open .fab { display: none; }
  .zoom { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); right: var(--gr); }
  #menu { top: 56px; }
}
#chips { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 2px; width: min(240px, 100%); justify-self: end; padding: 6px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
#chips .chip { justify-content: flex-start; gap: 12px; min-height: 46px; padding: 8px 12px; font-size: 15px; border: 0; border-radius: 12px; box-shadow: none; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
#chips .chip .ico { width: 36px; height: 28px; }
#chips .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.bx, .sp { transform: scale(var(--iz, 1)); transition: transform .15s ease-out; }
.mvh { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.5); cursor: grab; touch-action: none; }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><h1>Мапа магістралей</h1><p id="stats">Завантаження…</p></div>
    <div class="search">
      <input id="q" type="search" placeholder="Адреса: вулиця, будинок, село, місто" autocomplete="off" aria-label="Пошук адреси">
      <div id="results" hidden></div>
    </div>
    <button class="btn" id="btnSave" aria-label="Зберегти"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span>Зберегти</span></button>
    <button class="btn" id="btnMenu" aria-expanded="false" aria-label="Меню"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Меню</span></button>
  </header>
  <div id="banner" hidden></div>
  <main id="stage">
    <div id="map"></div>
    <div class="fab">
      <button class="btn" id="btnLayer">Супутник</button>

    try {
      var r = await sb.auth.signInWithPassword({ email: email, password: pass });
      if (r.error) { msg.textContent = /invalid/i.test(r.error.message) ? 'Невірна пошта чи пароль.' : 'Не вдалося увійти: ' + r.error.message; return; }
      loginEl.hidden = true; $('#authPass').value = ''; lsSet('mm-nocloud', 0); cloudReady = true; toast('Вхід виконано');
      await syncAll();
    } catch (e) { msg.textContent = 'Немає зв’язку з хмарою. Перевірте інтернет і адресу проєкту.'; }
    finally { btn.disabled = false; }
  };
  $('#mCloud').onclick = function () { menu.hidden = true; showLogin(true); };
  $('#mLogout').onclick = async function () {
    menu.hidden = true; if (!sb) { toast('Хмара не підключена'); return; }
    try { await sb.auth.signOut(); } catch (e) {}
    cloudReady = false; if (rtChan) { try { sb.removeChannel(rtChan); } catch (e) {} rtChan = null; }
    setCloud('локально'); toast('Ви вийшли з хмари. Дані лишились на цьому пристрої.', 3500);
  };
  async function startCloud() {
    var cfg = supaCfg();
    if (!cfg.url || !cfg.key) { setCloud('локально'); if (!lsGet('mm-nocloud', 0)) showLogin(); return; }
    if (!window.supabase) { setCloud('локально (хмара недоступна)'); return; }
    if (!sb) makeClient();
    try {
      var s = await sb.auth.getSession();
      if (s.data && s.data.session) { cloudReady = true; await syncAll(); } else { setCloud('локально, потрібен вхід'); showLogin(); }
    } catch (e) { setCloud('☁ немає зв’язку'); }
  }
  async function retryCloud() {
    if (!sb) return;
    try { var s = await sb.auth.getSession(); if (s.data && s.data.session) { cloudReady = true; await syncAll(); } } catch (e) {}
  }
  window.addEventListener('online', function () { if (sb && !cloudReady) retryCloud(); else if (cloudReady) syncAll(); });
  $('#btnSave').onclick = async function () {
    var b = $('#btnSave'); b.disabled = true;
    try {
      Array.from(saveT.keys()).forEach(function (id) { queueSave(id, 0); });
      await new Promise(function (r) { setTimeout(r, 700); });
      if (sb && cloudReady) {
        await syncAll(); await new Promise(function (r) { setTimeout(r, 500); });
        toast(dirty.size || tomb.size ? 'Збережено на пристрої. У хмару відправиться, коли буде зв’язок.' : 'Збережено ✓ Дані є в хмарі.', 3500);
      } else toast('Збережено на цьому пристрої. Щоб бачити на інших, увійдіть у хмару (Меню).', 4000);
    } catch (e) { toast('Не вдалося зберегти. Спробуйте ще раз.'); }
    b.disabled = false;
  };
  setInterval(function () { if (cloudReady && (dirty.size || tomb.size)) syncAll(); }, 30000);

  /* ---------- запуск ---------- */
  async function init() {
    buildChips(); setTool('select'); drawDraft();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    try { dbp = openDb(); await dbp; } catch (e) { memMode = true; $('#banner').hidden = false; $('#banner').textContent = 'Браузер не дозволяє зберігати дані (приватне вікно?). Зміни зникнуть після закриття сторінки.'; }
    var rows = await dbAll('objs').catch(function () { return []; });
    rows.forEach(function (o) { objs.set(o.id, o); draw(o.id); });
    updateStats(); if (rows.length && !restored) fitObjs();
    if (rows.length) { var lb = 0; try { lb = +localStorage.getItem('mm-lastbackup') || 0; } catch (e) {} if (Date.now() - lb > 3 * 864e5) setTimeout(function () { toast('Давно не було резервної копії. Меню → Зберегти резервну копію.', 7000); }, 2500); }
    loadOblasts();
    startCloud();
  }
  window.addEventListener('beforeunload', function () { saveT.forEach(function (_, id) { var o = objs.get(id); if (o) { dbPut('objs', JSON.parse(JSON.stringify(o))); dirty.add(id); } }); persistSets(); });
  init();
})();
</script>
</body>
</html>
